<svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 32 32">
  <!-- Audiform scene themes: a glowing blue glass hand, closed, holding what it drags. Hot spot (16, 16). -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#d8f8ff"/>
      <stop offset="0.35" stop-color="#5cc8ff"/>
      <stop offset="0.75" stop-color="#1a86f0"/>
      <stop offset="1" stop-color="#0a4fc8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feMorphology operator="dilate" radius="1.3"/>
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <filter id="rim" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology operator="dilate" radius="0.6"/>
    </filter>
    <g id="hand">
      <rect x="8.6" y="12.5" width="15.6" height="14" rx="5.5"/>
      <rect x="8.8" y="10.4" width="3.5" height="6" rx="1.75"/>
      <rect x="12.5" y="9.4" width="3.5" height="6" rx="1.75"/>
      <rect x="16.2" y="9.6" width="3.5" height="6" rx="1.75"/>
      <rect x="19.9" y="10.6" width="3.3" height="6" rx="1.65"/>
      <rect x="6.6" y="15.6" width="9.5" height="3.5" rx="1.75"/>
    </g>
  </defs>
  <use href="#hand" fill="#5ec6ff" filter="url(#glow)"/>
  <use href="#hand" fill="#8fdcff" filter="url(#rim)"/>
  <use href="#hand" fill="url(#body)"/>
  <path d="M14.2 10.8 V12.6 M11 21 Q16 19.4 21.5 21" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.85"/>
</svg>
