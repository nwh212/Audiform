<svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 32 32">
  <!-- Audiform scene themes: a glowing blue glass arrow. Tip at (4, 3). -->
  <defs>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#d8f8ff"/>
      <stop offset="0.3" stop-color="#5cc8ff"/>
      <stop offset="0.7" stop-color="#1a86f0"/>
      <stop offset="1" stop-color="#0a4fc8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>
  <!-- Glow around the edge. -->
  <path d="M4 3 L4 24.5 L9.4 19.3 L13.2 27.4 L17.6 25.4 L13.9 17.5 L21.6 17.5 Z" fill="none" stroke="#5ec6ff" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Body. -->
  <path d="M4 3 L4 24.5 L9.4 19.3 L13.2 27.4 L17.6 25.4 L13.9 17.5 L21.6 17.5 Z" fill="url(#body)" stroke="#8fdcff" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- Shine across the upper left. -->
  <path d="M5.4 6.2 L5.4 17.6 L14.8 11.6 Z" fill="url(#shine)"/>
  <!-- Bright rim on the lower right edge. -->
  <path d="M13.9 17.5 L21.6 17.5" stroke="#bff0ff" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
</svg>
