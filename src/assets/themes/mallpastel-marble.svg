<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Audiform Mall Pastel '95 theme: white marble with soft lavender veins, a seamless tile. -->
  <filter id="veins" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.011 0.035" numOctaves="4" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.56  0 0 0 0 0.76  0 0 0 -2.6 1.3"/>
  </filter>
  <rect width="400" height="400" fill="#ffffff"/>
  <rect width="400" height="400" filter="url(#veins)" opacity="0.3"/>
</svg>
