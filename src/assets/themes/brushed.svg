<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120">
  <!-- Audiform Analog theme: brushed aluminum. Long hairline streaks from very stretched noise, in light and dark, over a pale metal tone. Our own texture; it tiles seamlessly. -->
  <filter id="brush" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0009 0.75" numOctaves="3" seed="13" stitchTiles="stitch" result="fine"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.003 0.18" numOctaves="2" seed="2" stitchTiles="stitch" result="coarse"/>
    <feComposite in="fine" in2="coarse" operator="arithmetic" k1="0" k2="0.75" k3="0.35" k4="-0.05" result="v"/>
    <feColorMatrix in="v" type="matrix" values="0.55 0 0 0 0.5  0.55 0 0 0 0.5  0.55 0 0 0 0.52  0 0 0 0 1"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#brush)"/>
</svg>
