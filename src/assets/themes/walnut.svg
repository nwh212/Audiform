<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420">
  <!-- Audiform Analog theme: oiled walnut. Growth rings are contour bands of a slow noise (the arched "cathedral" figure), crossed with fine fibers and dark pores, in deep chocolate browns. Our own texture; it tiles seamlessly. -->
  <filter id="wood" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0022 0.016" numOctaves="3" seed="21" stitchTiles="stitch" result="figure"/>
    <feComponentTransfer in="figure" result="rings">
      <feFuncR type="table" tableValues="0 1 0.15 1 0 0.9 0.1 1 0 0.85 0.05 1 0 1 0.2 1 0"/>
    </feComponentTransfer>
    <feTurbulence type="fractalNoise" baseFrequency="0.003 0.42" numOctaves="2" seed="5" stitchTiles="stitch" result="fibers"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.0015 0.05" numOctaves="2" seed="8" stitchTiles="stitch" result="tone"/>
    <feComposite in="rings" in2="fibers" operator="arithmetic" k1="0" k2="0.45" k3="0.4" k4="-0.05" result="mix"/>
    <feComposite in="mix" in2="tone" operator="arithmetic" k1="0" k2="0.8" k3="0.35" k4="-0.1" result="v"/>
    <feColorMatrix in="v" type="matrix" values="0.42 0 0 0 0.075  0.22 0 0 0 0.038  0.13 0 0 0 0.028  0 0 0 0 1"/>
  </filter>
  <filter id="pores" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.015 0.8" numOctaves="1" seed="3" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.04  0 0 0 0 0.02  0 0 0 0 0.01  0 0 0 -3 1.75"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#wood)"/>
  <rect width="100%" height="100%" filter="url(#pores)" opacity="0.5"/>
</svg>
