# Audiform Separation Engine: client for Audiform 2.
# Unlike the engine, this crate is meant to be copied into Audiform 2's
# source: it holds nothing private, only how to download, check, start and
# talk to the engine.

[package]
name = "audiform-separate-client"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Downloads, checks, starts and drives the Audiform separation engine (protocol 2) for Audiform 2."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"

[dev-dependencies]
hound = "3.5"

[lints.rust]
unsafe_code = "forbid"

# Its own workspace, apart from the engine.
[workspace]
