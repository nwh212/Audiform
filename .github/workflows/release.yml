# Builds the Windows installer and a portable zip when a version tag is
# pushed (git tag v0.1.0 && git push origin v0.1.0), or from the Actions
# tab: Release > Run workflow, with the version typed in. It makes a DRAFT
# release, so nothing is public until you review and publish it. A draft
# made from the Actions tab gets its tag when you publish it.
# Each platform builds in its own job and hands its files over as a build
# artifact; the last job makes the draft with everything that built.
# Linux and macOS are experimental: if one fails, the draft still gets
# the Windows files. The macOS build is not signed or notarized (no Apple
# developer account). Files are staged in the runner's temp folder, never
# in the repository, so nothing old from the checkout can slip in.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like v0.4.0 (it must match the version in package.json)"
        required: true

env:
  TAG: ${{ inputs.version || github.ref_name }}

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer and portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # The version typed in the Actions tab must be the one the build
      # carries, so the files and the app agree.
      - name: Check the version
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$want" ]; then echo "::error::Release $TAG, but package.json says $want."; exit 1; fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # ASIO needs LLVM (preinstalled on the runner) and the ASIO SDK,
      # which cpal's build script downloads. If that build fails, the
      # release still ships without ASIO.
      - name: Build installer (with ASIO)
        id: asio
        continue-on-error: true
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: npm run tauri build -- --features asio

      - name: Build installer (without ASIO)
        if: steps.asio.outcome != 'success'
        run: npm run tauri build

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ env.TAG }}"
          $out = Join-Path $env:RUNNER_TEMP "release"
          $portable = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path $out, $portable | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName (Join-Path $out "Audiform-$tag-setup.exe")
          Copy-Item src-tauri/target/release/audiform.exe (Join-Path $portable "Audiform.exe")
          Copy-Item LICENSE, README.md $portable
          Compress-Archive -Path (Join-Path $portable "*") -DestinationPath (Join-Path $out "Audiform-$tag-portable.zip")
          if ("${{ steps.asio.outcome }}" -ne "success") { "ASIO build failed; this installer has no ASIO." | Set-Content (Join-Path $out "NO-ASIO.txt") }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  linux:
    name: Linux AppImage and deb (experimental)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file xdg-utils libxdo-dev libssl-dev libfuse2t64 libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # The AppImage tools are AppImages themselves; extract-and-run means
      # they work without FUSE on the runner.
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
        run: npm run tauri build -- --bundles appimage,deb

      - name: Package
        run: |
          tag="${{ env.TAG }}"
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "$out/Audiform-$tag-linux-x86_64.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb "$out/Audiform-$tag-linux-amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  macos:
    name: macOS Apple silicon (experimental, unsigned)
    # macos-latest was not handed a runner (arm64 capacity) in two releases,
    # and macos-14 is retired on 2026-11-02: pinned to macos-15 (Apple silicon).
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # "-" means an ad hoc signature: no Apple account, no notarization.
      # Apple silicon needs at least this to run the app at all.
      - name: Build
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri build -- --bundles app,dmg

      - name: Package
        run: |
          tag="${{ env.TAG }}"
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp src-tauri/target/release/bundle/dmg/*.dmg "$out/Audiform-$tag-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  draft:
    name: Draft release
    needs: [windows, linux, macos]
    # Runs when Windows built, whatever happened to Linux and macOS.
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Checksums and draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ env.TAG }}"
          cd files
          if [ -f NO-ASIO.txt ]; then echo "::warning::The ASIO build failed; the Windows installer has no ASIO."; rm NO-ASIO.txt; fi
          sha256sum * > SHA256SUMS.txt
          ls -la
          # Every release, 0.x included, is a full release that becomes Latest when published.
          gh release create "$tag" --draft --target "${{ github.sha }}" --title "Audiform $tag" --generate-notes ./*
