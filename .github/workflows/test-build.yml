# Test build of this branch: the Windows installer and portable exe, and
# an experimental Linux AppImage and deb, as downloadable artifacts. Not
# part of the pull request.

name: Test build

on:
  push:
    branches: ["build/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows test build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer (with ASIO)
        id: asio
        continue-on-error: true
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: npm run tauri build -- --features asio

      - name: Build installer (without ASIO)
        if: steps.asio.outcome != 'success'
        run: npm run tauri build

      - name: Package
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "test-build"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName (Join-Path $out "Altered-Audio-Editor-buses-test-setup.exe")
          Copy-Item src-tauri/target/release/altered-audio-editor.exe (Join-Path $out "Altered Audio Editor (buses test).exe")

      - uses: actions/upload-artifact@v4
        with:
          name: altered-audio-editor-buses-test-windows
          path: ${{ runner.temp }}/test-build/*
          if-no-files-found: error

  linux:
    name: Linux test build (experimental)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file xdg-utils libxdo-dev libssl-dev libfuse2t64 libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # The AppImage tools are AppImages themselves; extract-and-run means
      # they work without FUSE on the runner.
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
        run: npm run tauri build -- --bundles appimage,deb

      - name: Package
        run: |
          out="$RUNNER_TEMP/test-build"
          mkdir -p "$out"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "$out/Altered-Audio-Editor-buses-test-linux-x86_64.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb "$out/Altered-Audio-Editor-buses-test-linux-amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: altered-audio-editor-buses-test-linux
          path: ${{ runner.temp }}/test-build/*
          if-no-files-found: error
