<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audiform</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Shared gradients that themes can use as SVG fills (unused by the default theme). -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <radialGradient id="glass-orb" cx="50%" cy="30%" r="70%">
          <stop offset="0" stop-color="#ffffff" />
          <stop offset="0.45" stop-color="#d4f1ff" />
          <stop offset="1" stop-color="#5cc2ec" />
        </radialGradient>
        <radialGradient id="glass-skirt" cx="50%" cy="35%" r="75%">
          <stop offset="0" stop-color="#f4fbff" />
          <stop offset="0.7" stop-color="#b9e2f5" />
          <stop offset="1" stop-color="#7cc3e6" />
        </radialGradient>
        <linearGradient id="glass-cap" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" />
          <stop offset="0.5" stop-color="#e2f6ff" />
          <stop offset="0.51" stop-color="#b8e6fa" />
          <stop offset="1" stop-color="#e6f7ff" />
        </linearGradient>
        <radialGradient id="glass-orb-night" cx="50%" cy="30%" r="70%">
          <stop offset="0" stop-color="#cfefff" />
          <stop offset="0.35" stop-color="#3f7fb0" />
          <stop offset="1" stop-color="#0c2440" />
        </radialGradient>
        <radialGradient id="glass-skirt-night" cx="50%" cy="35%" r="75%">
          <stop offset="0" stop-color="#2d5a80" />
          <stop offset="0.7" stop-color="#132e4c" />
          <stop offset="1" stop-color="#0a1a30" />
        </radialGradient>
      </defs>
    </svg>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
